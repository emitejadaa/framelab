name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: mise exec -- pnpm install --frozen-lockfile
        working-directory: frontend
      - run: mise exec -- pnpm typecheck
        working-directory: frontend
      - run: mise exec -- pnpm lint
        working-directory: frontend
      - run: mise exec -- pnpm build
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        with:
          name: static
          path: src/framelab/_static

  test:
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: static
          path: src/framelab/_static
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e . --group dev
      - name: generated TypeScript types are up to date
        run: python -m pytest tests/test_tsgen.py -q
      - run: python -m pytest -m "not slow" -q

  slow:
    needs: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: static
          path: src/framelab/_static
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install --upgrade pip
      - run: pip install -e . --group dev
      - name: packaging, real-browser E2E and notebook kernel
        run: python -m pytest -m slow -v
